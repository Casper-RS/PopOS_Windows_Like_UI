name: Build Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'images/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'images/**']
  workflow_dispatch:

# Pull requests cancel their own stale runs; pushes to main queue up.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.casper_rs.PopOSWindowsLikeUI.flatpak
          manifest-path: flatpak/io.github.casper_rs.PopOSWindowsLikeUI.yml
          # The action restores the newest cache starting with
          # "flatpak-builder-<arch>", so the key has to start with that too.
          cache-key: flatpak-builder-x86_64-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: io.github.casper_rs.PopOSWindowsLikeUI.flatpak
          retention-days: 7

  lockscreen:
    # Same Ubuntu base (and glibc) as Pop!_OS 24.04.
    runs-on: ubuntu-24.04
    env:
      LOCKSCREEN_BUILD_DIR: ${{ github.workspace }}/.lockscreen-build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libclang-dev libxkbcommon-dev libudev-dev \
            libinput-dev libdav1d-dev libwayland-dev libfontconfig-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .lockscreen-build/cosmic-greeter -> target
      - name: Build
        run: cp "$(lockscreen/build.sh | tail -n 1)" cosmic-greeter-lockscreen
      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-greeter-lockscreen
          path: cosmic-greeter-lockscreen
          retention-days: 7

  # Every push to main (that isn't docs-only or [skip ci]) becomes a release
  # with the next patch number. Pushing a v* tag releases under that tag instead.
  # Releases made with GITHUB_TOKEN don't start new workflow runs, so this can't loop.
  release:
    if: github.event_name == 'push'
    needs: [flatpak, lockscreen]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            last=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo v0.0.0)
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v$major.$minor.$((patch + 1))"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" assets/* --target "$GITHUB_SHA" --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
