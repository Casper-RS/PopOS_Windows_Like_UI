name: Build Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'images/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'images/**']
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.casper_rs.PopOSWindowsLikeUI.flatpak
          manifest-path: flatpak/io.github.casper_rs.PopOSWindowsLikeUI.yml
          # The action restores the newest cache starting with
          # "flatpak-builder-<arch>", so the key has to start with that too.
          cache-key: flatpak-builder-x86_64-${{ github.sha }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: io.github.casper_rs.PopOSWindowsLikeUI.flatpak

  lockscreen:
    # Same Ubuntu base (and glibc) as Pop!_OS 24.04.
    runs-on: ubuntu-24.04
    env:
      LOCKSCREEN_BUILD_DIR: ${{ github.workspace }}/.lockscreen-build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libclang-dev libxkbcommon-dev libudev-dev \
            libinput-dev libdav1d-dev libwayland-dev libfontconfig-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .lockscreen-build/cosmic-greeter -> target
      - name: Build
        run: cp "$(lockscreen/build.sh | tail -n 1)" cosmic-greeter-lockscreen
      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-greeter-lockscreen
          path: cosmic-greeter-lockscreen
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cosmic-greeter-lockscreen
